<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>归档 · newsdesk</title>
<meta name="description" content="自动聚合官方文件与媒体报道，给重要事件配有据可查的 AI 解读。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link rel="stylesheet" href="static/style.css">
</head>
<body data-page="archive">
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">nd</span><span class="brand-name">newsdesk</span><span class="brand-sub">资讯解读</span></a>
    <nav class="nav">
      <a href="index.html" >今日</a>
      <a href="archive.html" aria-current="page">归档</a>
      <a href="about.html" >方法</a>
    </nav>
  </div>
</header>
<main class="wrap">
<section class="page-head">
  <h1>归档</h1>
  <p class="lede">搜标题与一句话事实，按时间、等级、类型、信源筛选。</p>
</section>
<form class="filters" id="filters" onsubmit="return false">
  <input type="search" id="q" placeholder="搜索，例如：加息、CPI、条例" aria-label="搜索" autocomplete="off">
  <div class="filter-row">
    <label>从 <input type="date" id="from"></label>
    <label>到 <input type="date" id="to"></label>
    <label>等级 <select id="grade"><option value="">全部</option><option>A+</option><option>A</option><option>B</option><option>C</option><option value="below">未达 C</option></select></label>
    <label>类型 <select id="type"><option value="">全部</option><option value="central_bank_rate">央行利率决议</option><option value="central_bank_minutes">央行会议纪要</option><option value="central_bank_admin">央行程序性文件</option><option value="central_bank_other">央行其他</option><option value="econ_data_release">经济数据发布</option><option value="econ_data_interpretation">官方数据解读</option><option value="fiscal_release">财政发布</option><option value="policy_document">政策文件</option></select></label>
    <label>信源 <select id="source"><option value="">全部</option></select></label>
  </div>
</form>
<p class="result-count muted" id="count"></p>
<ol class="archive-list" id="results"></ol>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>每条 AI 结论都标注模型与生成时间，并可点回官方原文。媒体报道只展示标题与链接。不构成投资建议。</p>
    <p class="muted">内容更新至 2026-09-23 11:54（北京时间）</p>
  </div>
</footer>
<script src="static/archive.js" defer></script></body>
</html>
