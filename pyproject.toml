[project]
name = "newsdesk"
version = "0.1.0"
description = "私人资讯聚合与 AI 解读站：本地流水线 + 静态站"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsdesk"]
