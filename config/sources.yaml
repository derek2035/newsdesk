# 信源注册表。tier: L1 = 官方/法定披露（全文可展示，证据源）；L2 = 媒体（只存标题/URL/时间）
# display_policy: full | title_only
# fetch_method: rss | fed_rss | stats_html | govcn_json | manual
# 已排除（robots.txt 全站 Disallow）：人民银行 pbc.gov.cn、BLS api.bls.gov
sources:
  - id: fed
    name: 美联储 (Federal Reserve)
    tier: L1
    lang: en
    fetch_method: fed_rss
    display_policy: full
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    homepage: https://www.federalreserve.gov/

  - id: stats_cn
    name: 国家统计局
    tier: L1
    lang: zh
    fetch_method: stats_html
    display_policy: full
    url: https://www.stats.gov.cn/sj/zxfb/
    homepage: https://www.stats.gov.cn/

  - id: gov_cn
    name: 中国政府网 · 最新政策
    tier: L1
    lang: zh
    fetch_method: govcn_json
    display_policy: full
    url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
    homepage: https://www.gov.cn/zhengce/

  - id: bbc
    name: BBC Business
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://feeds.bbci.co.uk/news/business/rss.xml

  - id: guardian
    name: The Guardian Business
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://www.theguardian.com/uk/business/rss

  - id: nyt
    name: NYT Business
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml

  - id: cnbc
    name: CNBC Finance
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://www.cnbc.com/id/10000664/device/rss/rss.html

  - id: marketwatch
    name: MarketWatch
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories

  - id: aljazeera
    name: Al Jazeera
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://www.aljazeera.com/xml/rss/all.xml

  - id: jiemian
    name: 界面新闻
    tier: L2
    lang: zh
    fetch_method: rss
    display_policy: title_only
    url: https://a.jiemian.com/index.php?m=article&a=rss

  - id: economist
    name: The Economist · Finance
    tier: L2
    lang: en
    fetch_method: rss
    display_policy: title_only
    url: https://www.economist.com/finance-and-economics/rss.xml

  # 手工补录的媒体报道（仅标题 / URL / 时间），来自第 0 步调研；源在文件里逐条声明
  - id: manual
    name: 手工补录
    tier: L2
    lang: zh
    fetch_method: manual
    display_policy: title_only
    url: config/manual_documents.yaml
